# Settings for Backend (on Cloud Run).
runConfig:
  minInstances: 0
  cpu: 2
  memoryMiB: 1024

env:
  - variable: GOOGLE_WORKSPACE_AUTH_EMAIL
    value: info@remotebusinesspartner.com.au
    availability:
      - RUNTIME

  - variable: GOOGLE_WORKSPACE_FROM_EMAIL
    value: tenders@remotebusinesspartner.com.au
    availability:
      - RUNTIME

  - variable: GOOGLE_WORKSPACE_FROM_NAME
    value: Remote Business Partner Tenders
    availability:
      - RUNTIME

  - variable: SIGNUP_NOTIFICATION_TO
    value: tenders@remotebusinesspartner.com.au
    availability:
      - RUNTIME

  - variable: ONBOARDING_SUBMISSION_NOTIFICATION_TO
    value: tenders@remotebusinesspartner.com.au
    availability:
      - RUNTIME

  - variable: ONBOARDING_SUBMISSIONS_SPREADSHEET_ID
    value: 18wC_QHcT9lZjezNpz_TstG6Yfcq_KwDHZiez3hdtsHY
    availability:
      - RUNTIME

  - variable: ONBOARDING_SUBMISSIONS_SHEET_NAME
    value: OnboardingSubmissions
    availability:
      - RUNTIME
